# Traefik dynamic configuration for Server App Manager.
# The backend router is now declared via Docker labels in docker-compose.yml
# so BASE_DOMAIN is controlled by the .env variable.
# This file still defines the backend service and shared security middleware.

http:
  middlewares:
    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customFrameOptionsValue: "DENY"
        browserXssFilter: true

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:8080"
