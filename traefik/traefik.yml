# Traefik static configuration for Server App Manager.
# Docs: https://doc.traefik.io/traefik/

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true
  docker:
    exposedByDefault: false
    # NOTE: Traefik does NOT interpolate ${VAR} placeholders in its static
    # configuration file (only the dynamic file/label config supports that via
    # `{{env "VAR"}}` templating). This must match TENANT_ID's actual value
    # (default "appforge") or be kept in sync manually if TENANT_ID changes.
    # Every container that Traefik routes to also sets the `traefik.docker.network`
    # label explicitly (see docker-compose.yml / install.rs), which takes
    # precedence over this default and is what actually makes routing correct
    # for containers attached to more than one network.
    network: "appforge_backend"

api:
  dashboard: false

# ACME / Let's Encrypt.
# Staging by default to avoid rate limits during development.
# Set ACME_PRODUCTION=true in .env to use the production ACME server.
# NOTE: like `network` above, this email is a literal default (not interpolated
# from ACME_EMAIL) because Traefik doesn't support env substitution here.
certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@example.com"
      storage: "/acme/acme.json"
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web
