name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-backend:
    name: Build & test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/target/release/server-app-manager-backend
          if-no-files-found: warn

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm via corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: warn

  lint-yaml:
    name: Lint YAML & OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: 'yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}" roles/ traefik/ docker-compose.yml'
      - name: Validate OpenAPI spec
        run: npx -y @redocly/cli lint api/swagger.yaml

  docker-build:
    name: Docker compose build
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Copy .env.example to .env
        run: cp .env.example .env
      - name: Build images
        run: docker compose build

  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Copy .env.example to .env
        run: cp .env.example .env
      - name: Build images
        run: docker compose build
      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "tenant_default_backend:latest"
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Run Trivy on Traefik image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "traefik:v3.4"
          severity: HIGH,CRITICAL
          exit-code: "1"

  # TODO: End-to-end tests with Docker-in-Docker install/stop/rollback flow.
  # Requires a DinD service container or self-hosted runner.
  push-dockerhub:
    name: Push backend image to Docker Hub
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/appforge
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  e2e:
    name: End-to-end tests (stub)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - run: echo "E2E tests not yet implemented — see docs/ARCHITECTURE.md §12"
