@if (!isLogin()) {
  <div class="shell">
    <aside class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar__brand">
        <div class="sidebar__logo">S</div>
        <span>{{ title() }}</span>
      </div>
      <nav class="sidebar__nav">
        <h4>General</h4>
        <a
          class="nav-link"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="ic">□</span>
          Dashboard
        </a>
        <a class="nav-link" routerLink="/apps" routerLinkActive="active">
          <span class="ic">□</span>
          App Store
        </a>
        <a class="nav-link" routerLink="/my-apps" routerLinkActive="active">
          <span class="ic">□</span>
          My Apps
        </a>

        <h4>Administration</h4>
        <a class="nav-link" routerLink="/admin" routerLinkActive="active">
          <span class="ic">□</span>
          Admin
        </a>
      </nav>
      <div class="sidebar__user">
        <div class="avatar">U</div>
        <div>
          <div class="name">Admin</div>
          <div class="role">Administrator</div>
        </div>
        <button class="btn btn--ghost btn--sm logout" (click)="logout()">Logout</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="crumb">Server App Manager</span>
        <h1>{{ title() }}</h1>
        <div class="spacer"></div>
        <div class="search">
          <span class="ic">🔍</span>
          <input type="search" placeholder="Search..." />
        </div>
      </header>
      <div class="content">
        <router-outlet />
      </div>
    </div>
  </div>
} @else {
  <router-outlet />
}
