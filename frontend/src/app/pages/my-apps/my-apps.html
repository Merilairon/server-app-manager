<div class="my-apps-page">
  <h1>My Apps</h1>

  @if (loading()) {
    <p class="loading">Loading…</p>
  } @else if (error) {
    <p class="error">{{ error }}</p>
  } @else {
    <div class="status-chips">
      @for (s of statuses(); track s) {
        <button
          type="button"
          class="chip"
          [class.active]="statusFilter() === s"
          (click)="setStatus(s)"
        >
          {{ s }}
        </button>
      }
    </div>

    <div class="app-grid">
      @for (app of filteredApps(); track app.slug) {
        <div class="app-card">
          <h3>{{ app.name }}</h3>
          <p class="status">{{ app.status }}</p>
          <div class="actions">
            <a [href]="'https://' + app.slug + '.app.example.com'" target="_blank">Open</a>
            <button (click)="uninstall(app)">Uninstall</button>
          </div>
        </div>
      } @empty {
        <p>No installed apps yet.</p>
      }
    </div>
  }
</div>
