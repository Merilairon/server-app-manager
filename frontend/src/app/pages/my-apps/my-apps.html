<div class="my-apps-page">
  <h2 class="section-title">My Apps</h2>

  @if (loading()) {
    <p class="loading">Loading…</p>
  } @else if (error) {
    <p class="error">{{ error }}</p>
  } @else {
    <div class="status-chips">
      @for (s of statuses(); track s) {
        <button
          type="button"
          class="chip"
          [class.active]="statusFilter() === s"
          (click)="setStatus(s)"
        >
          {{ s }}
        </button>
      }
    </div>

    <div class="app-grid">
      @for (app of filteredApps(); track app.slug) {
        <div class="app-card">
          <div class="app-card__top">
            <div class="app-icon">{{ app.name[0] }}</div>
            <div>
              <div class="app-card__name">{{ app.name }}</div>
              <span [class]="statusBadgeClass(app.status)">
                <span class="dot"></span>{{ app.status }}
              </span>
            </div>
          </div>
          <div class="app-card__foot">
            <a class="btn btn--primary btn--sm" [href]="appUrl(app)" target="_blank"> Open </a>
            <button class="btn btn--danger btn--sm" (click)="uninstall(app)">Uninstall</button>
          </div>
        </div>
      } @empty {
        <p class="dim">No installed apps yet.</p>
      }
    </div>
  }
</div>
