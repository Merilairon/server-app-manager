name: Nextcloud
slug: nextcloud
description: Self-hosted file sync, share, and collaboration platform, with its own private database.
category: Productivity
image: nextcloud:apache
service: nextcloud
placeholders:
  - name: NEXTCLOUD_ADMIN_PASSWORD
    type: secret
    label: Admin password
    required: true
    default: "changeme"
env:
  NEXTCLOUD_ADMIN_USER: admin
  MYSQL_HOST: db
  MYSQL_DATABASE: nextcloud
  MYSQL_USER: nextcloud
  MYSQL_PASSWORD: nextcloud-db-changeme
ports:
  - container: 80
volumes:
  - nextcloud_data:/var/www/html
restart: unless-stopped
extra_services:
  - name: db
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: nextcloud-root-changeme
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud-db-changeme
    volumes:
      - nextcloud_db:/var/lib/mysql
    healthcheck:
      test: "healthcheck.sh --connect --innodb_initialized"
