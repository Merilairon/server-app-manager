name: Pi-hole
slug: pihole
description: Network-wide ad blocking via DNS sinkholing with a web admin UI.
category: Security
image: pihole/pihole:latest
service: pihole
env:
  TZ: UTC
placeholders:
  - name: WEBPASSWORD
    type: secret
    label: Admin password
    required: true
    default: "changeme"
ports:
  - container: 80
volumes:
  - pihole_data:/etc/pihole
  - pihole_dnsmasq:/etc/dnsmasq.d
restart: unless-stopped
