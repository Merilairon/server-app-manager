name: Firefly III
slug: firefly-iii
description: Self-hosted personal finance manager for tracking expenses and budgets, with its own private database.
category: Productivity
image: fireflyiii/core:latest
service: firefly-iii
placeholders:
  - name: APP_KEY
    type: secret
    label: Application encryption key (32 chars)
    required: true
    default: "changeme-32-character-app-key!!"
env:
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_DATABASE: firefly
  DB_USERNAME: firefly
  DB_PASSWORD: firefly-db-changeme
  APP_URL: http://localhost
ports:
  - container: 8080
volumes:
  - firefly-iii_upload:/var/www/html/storage/upload
restart: unless-stopped
extra_services:
  - name: db
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: firefly-root-changeme
      MYSQL_DATABASE: firefly
      MYSQL_USER: firefly
      MYSQL_PASSWORD: firefly-db-changeme
    volumes:
      - firefly-iii_db:/var/lib/mysql
