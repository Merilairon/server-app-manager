name: Mattermost
slug: mattermost
description: Self-hosted team chat and collaboration platform, with its own private database.
category: Office
image: mattermost/mattermost-team-edition:latest
service: mattermost
env:
  MM_SQLSETTINGS_DRIVERNAME: postgres
  MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost:mattermost-db-changeme@db:5432/mattermost?sslmode=disable"
  MM_SERVICESETTINGS_SITEURL: "http://localhost:8065"
ports:
  - container: 8065
volumes:
  - mattermost_data:/mattermost/data
  - mattermost_logs:/mattermost/logs
  - mattermost_config:/mattermost/config
restart: unless-stopped
extra_services:
  - name: db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: mattermost-db-changeme
      POSTGRES_DB: mattermost
    volumes:
      - mattermost_db:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U mattermost"
